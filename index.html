<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Growth Stimulator</title>
    <style>
       body{
    margin:20px;
    font-family:Arial;
    background:#eef3ee;
}

h1{
    text-align:center;
    color:green;
    margin-top:20px;
    margin-bottom:30px;
}

.container{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:50px;

    margin-top:40px;

}

.left{

    display:flex;

    flex-direction:column;

    gap:15px;

}

button{

    width:250px;

    padding:15px;

    border:none;

    border-radius:10px;

    background:green;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;
    height:80px;

}

button:hover{

    transform:scale(1.05);

    background:#0a7c0a;

}

#tree{

    width:500px;

    max-width:100%;

    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);

}

#info{

    text-align:center;
    margin-top:30px;
    font-size:22px;
    font-weight:bold;
    background:white;
    padding:15px;
    border-radius:10px;
    border-left:5px solid green;
    max-width:700px;
    margin:20px auto;

}

@media(max-width:768px){

.container{

    flex-direction:column;

}

.left{

    width:100%;

    align-items:center;

}

button{

    width:90%;

}

#tree{

    width:320px;

}

}
    </style>
    </head>
    <body>
        <h1>Tree Growth Stimulator</h1>
        <div class="container">
            <div class="left">
        <button onclick="addwater()">💧 Water</button>
        <button onclick="urea()">🌿Urea</button>
        <button onclick="addflowers()">🌸Potassium Nitrate (KNO₃)</button>
        <button onclick="addpesticide()">🛡️2,4-D</button>
        <button onclick="addfruits()">🍎Potassium Sulphate (SOP)</button>
        </div>
        <div class="right">
            <img id="tree" src="plant1.png.png" alt="Tree Growth">
            </div>
            </div>
            <p id="info"></p>
        <script src="./script.js"></script>

    </body>
    </html>
