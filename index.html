<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Growth Stimulator</title>
    <style>
        body
        {
            text-align: center;
            font-family:Arial,sans-serif;
            margin-top:50px;
        }
        h1
        {
            color:green;
        }
        #tree
        {
            width:300px;
            display:block;

        }
        button

           display:flex;
           flex-wrap:wrap;
           justify-content:center;
           gap:10px;

           margin:30px auto;

        {
            opacity:0.8;
        }

        <h1>Tree Growth Stimulator</h1>
        <br><br>
        <img id="tree" src="plant1.png.png" width="300">

        <button onclick="addflowers()">Potassium Nitrate (KNO₃)</button>
        <button onclick="addpesticide()">2,4-D</button>
        <button onclick="addfruits()">Potassium Sulphate (SOP)</button>

        <script src="./script.js"></script>
